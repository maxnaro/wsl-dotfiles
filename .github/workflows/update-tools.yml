name: Update tools
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      package:
        description: 'Optional manifest tool name; empty checks every supported tool'
        type: string
        default: ''
      discovery_only:
        description: 'Report releases without publishing PRs'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: tool-updates
  cancel-in-progress: false
  queue: max
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Discover official stable releases
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--check)
          if [[ -n "$PACKAGE" ]]; then args+=(--tool "$PACKAGE"); fi
          python setup/update_tools.py "${args[@]}" | tee "$RUNNER_TEMP/releases.json"
          {
            echo '### Official release discovery'
            echo '```json'
            cat "$RUNNER_TEMP/releases.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: discover
    if: vars.UPDATER_ENABLED == 'true' && (github.event_name == 'schedule' || !inputs.discovery_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Never consume candidate branches or artifacts in this privileged job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create dedicated updater App installation token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish verified per-tool PRs through GitHub API
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          REPOSITORY: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
        run: |
          args=(publish --repo "$REPOSITORY" --bot-login "$BOT_LOGIN")
          if [[ -n "$PACKAGE" ]]; then args+=(--tool "$PACKAGE"); fi
          python setup/update_prs.py "${args[@]}"
